# Development database for integration tests:
#   docker compose up -d
#   FUZZPHONY_TEST_DSN="pgsql:host=127.0.0.1;port=5432;dbname=fuzzphony;user=fuzzphony;password=fuzzphony" composer test:integration
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fuzzphony
      POSTGRES_USER: fuzzphony
      POSTGRES_PASSWORD: fuzzphony
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuzzphony"]
      interval: 2s
      retries: 20
