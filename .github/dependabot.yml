version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "composer"
    directory: "/demo"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/demo"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/demo"
    schedule:
      interval: "weekly"
    ignore:
      # A PostgreSQL major version can't open the previous one's data directory: the demo's
      # pgdata volume would stop starting. Majors are done by hand (see demo/README.md "Reset").
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
