name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer validate --strict

  quality:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          coverage: none
      - run: composer install --no-progress --prefer-dist
      - run: composer cs
      - run: composer stan

  tests:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        postgres: ['15', '16', '17']
        symfony: ['7.3', '8.0']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: fuzzphony
          POSTGRES_USER: fuzzphony
          POSTGRES_PASSWORD: fuzzphony
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fuzzphony"
          --health-interval 2s --health-retries 20
    env:
      FUZZPHONY_TEST_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=fuzzphony;user=fuzzphony;password=fuzzphony"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, mbstring
          coverage: pcov
      - name: Pin Symfony ${{ matrix.symfony }}
        run: >-
          composer require --dev --no-update
          "symfony/console:${{ matrix.symfony }}.*"
          "symfony/framework-bundle:${{ matrix.symfony }}.*"
          "symfony/messenger:${{ matrix.symfony }}.*"
          "symfony/yaml:${{ matrix.symfony }}.*"
      - run: composer install --no-progress --prefer-dist
      - run: vendor/bin/phpunit --coverage-text

  prefer-lowest:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          coverage: none
      - run: composer update --no-progress --prefer-dist --prefer-lowest --prefer-stable
      - run: composer test

  coverage:
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fuzzphony
          POSTGRES_USER: fuzzphony
          POSTGRES_PASSWORD: fuzzphony
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fuzzphony"
          --health-interval 2s --health-retries 20
    env:
      FUZZPHONY_TEST_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=fuzzphony;user=fuzzphony;password=fuzzphony"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          coverage: pcov
      - run: composer install --no-progress --prefer-dist
      - run: vendor/bin/phpunit --coverage-clover=coverage.xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
