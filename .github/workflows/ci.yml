name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer validate --strict

  quality:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          coverage: none
      - run: composer install --no-progress --prefer-dist
      - run: composer cs
      - run: composer stan

  tests:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        postgres: ['15', '16', '17', '18']
        symfony: ['7.4', '8.0']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: fuzzphony
          POSTGRES_USER: fuzzphony
          POSTGRES_PASSWORD: fuzzphony
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fuzzphony"
          --health-interval 2s --health-retries 20
    env:
      FUZZPHONY_TEST_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=fuzzphony;user=fuzzphony;password=fuzzphony"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, mbstring
          coverage: pcov
      - name: Pin Symfony ${{ matrix.symfony }}
        run: >-
          composer require --dev --no-update
          "symfony/console:${{ matrix.symfony }}.*"
          "symfony/framework-bundle:${{ matrix.symfony }}.*"
          "symfony/messenger:${{ matrix.symfony }}.*"
          "symfony/yaml:${{ matrix.symfony }}.*"
      - run: composer install --no-progress --prefer-dist
      - run: vendor/bin/phpunit --coverage-text

  prefer-lowest:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          coverage: none
      - run: composer update --no-progress --prefer-dist --prefer-lowest --prefer-stable
      - run: composer test

  demo-smoke:
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fuzzphony
          POSTGRES_USER: fuzzphony
          POSTGRES_PASSWORD: fuzzphony
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fuzzphony"
          --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: "postgresql://fuzzphony:fuzzphony@127.0.0.1:5432/fuzzphony?serverVersion=18&charset=utf8"
      PGPASSWORD: fuzzphony
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          coverage: none
      - name: Install demo dependencies
        working-directory: demo
        run: composer install --no-progress --prefer-dist
      - name: Seed a small catalogue
        run: |
          psql -h 127.0.0.1 -U fuzzphony fuzzphony -q -v rows=1000 -v ON_ERROR_STOP=1 -f benchmarks/seed.sql
          psql -h 127.0.0.1 -U fuzzphony fuzzphony -q -v ON_ERROR_STOP=1 -f demo/sql/lang_product.sql
      - name: Lint container
        working-directory: demo
        run: php bin/console lint:container
      - name: Apply schema and reindex
        working-directory: demo
        run: |
          php bin/console fuzzphony:schema --apply
          php bin/console fuzzphony:reindex --batch=1000
      - name: Doctor
        working-directory: demo
        run: php bin/console fuzzphony:doctor --strict

  coverage:
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fuzzphony
          POSTGRES_USER: fuzzphony
          POSTGRES_PASSWORD: fuzzphony
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fuzzphony"
          --health-interval 2s --health-retries 20
    env:
      FUZZPHONY_TEST_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=fuzzphony;user=fuzzphony;password=fuzzphony"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          coverage: pcov
      - run: composer install --no-progress --prefer-dist
      - run: vendor/bin/phpunit --coverage-clover=coverage.xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # Fork PRs don't have access to CODECOV_TOKEN, so only hard-fail CI on
          # same-repo pushes/PRs; degrade to a warning on external contributors' PRs.
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      # The goal is 100%; this floor only stops a real slide (see CONTRIBUTING.md).
      - name: Require at least 90% line coverage
        run: >-
          php -r '$m = simplexml_load_file("coverage.xml")->project->metrics;
          $p = 100 * (int) $m["coveredstatements"] / max(1, (int) $m["statements"]);
          printf("Line coverage: %.2f%%\n", $p); exit($p < 90 ? 1 : 0);'

  # The one required status check of the main branch: green only when every job above passed.
  ci-ok:
    if: always()
    needs: [validate, quality, tests, prefer-lowest, demo-smoke, coverage]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
