name: Mutation testing

# Infection mutation testing. Pull requests only mutate their changed lines (fast, gives quick
# feedback); the full baseline across src/ runs on demand (once per release, started by the maintainer). No minMsi gate yet -- see
# docs/roadmap.md#mutation-testing. Not part of the required `ci-ok` check in ci.yml.
on:
  workflow_dispatch: {}
  pull_request:

permissions:
  contents: read

jobs:
  # Fast feedback on a pull request: mutates only the added/modified lines against origin/main.
  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fuzzphony_test
          POSTGRES_USER: fuzzphony
          POSTGRES_PASSWORD: fuzzphony
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fuzzphony"
          --health-interval 2s --health-retries 20
    env:
      FUZZPHONY_TEST_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=fuzzphony_test;user=fuzzphony;password=fuzzphony"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          coverage: pcov
      - run: composer install --no-progress --prefer-dist
      # The integration tests share one database and a handful of tables; PostgresTestCase::dsn()
      # gives each Infection worker (TEST_TOKEN=1, 2, ...) its own database, so --threads=max is
      # safe.
      - run: >-
          vendor/bin/infection --threads=max --only-covering-test-cases --show-mutations=0
          --git-diff-lines --git-diff-base=origin/main
          --logger-github

  # The full baseline across all of src/, on demand (once per release).
  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # only this job writes (the badge file on the `badges` branch); the workflow default stays read-only
    permissions:
      contents: write
    # A full run (about 6,000 mutants) takes under 20 minutes on four threads.
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fuzzphony_test
          POSTGRES_USER: fuzzphony
          POSTGRES_PASSWORD: fuzzphony
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fuzzphony"
          --health-interval 2s --health-retries 20
    env:
      FUZZPHONY_TEST_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=fuzzphony_test;user=fuzzphony;password=fuzzphony"
      # Only set on the upstream repository; forks never have it.
      STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring
          coverage: pcov
      - run: composer install --no-progress --prefer-dist
      # One pass: infection-dashboard.json5 is infection.json5 plus the Stryker Dashboard report,
      # which only warns (doesn't fail) when STRYKER_DASHBOARD_API_KEY is unset, e.g. on forks.
      - run: >-
          vendor/bin/infection --threads=max --only-covering-test-cases --show-mutations=0
          --configuration=infection-dashboard.json5 --logger-github
      # The README badge: the Stryker Dashboard refuses a report this large (HTTP 413), so the covered score of this run is
      # published as a shields.io endpoint file on an unprotected `badges` branch.
      - name: Publish the mutation badge
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=build/infection/summary-log.txt
          get() { awk -F': ' -v k="$1" '$1==k {print $2}' "$f"; }
          killed=$(( $(get 'Killed by Test Framework') + $(get 'Killed by Static Analysis') + $(get 'Timed Out') ))
          escaped=$(get 'Escaped')
          msi=$(( 100 * killed / (killed + escaped) ))
          if [ "$msi" -ge 90 ]; then color=brightgreen; elif [ "$msi" -ge 80 ]; then color=green; elif [ "$msi" -ge 60 ]; then color=yellow; else color=red; fi
          dir=$(mktemp -d); cd "$dir"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin badges && git checkout -q -b badges FETCH_HEAD || git checkout -q -b badges
          printf '{"schemaVersion":1,"label":"mutation score","message":"%s%%","color":"%s"}\n' "$msi" "$color" > mutation.json
          git add mutation.json
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "Mutation badge: ${msi}% (${GITHUB_SHA::7})" || exit 0
          git push -q origin badges
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: infection-report
          path: build/infection/
