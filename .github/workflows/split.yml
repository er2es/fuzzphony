name: Split packages

# Disabled: this needs a SPLIT_ACCESS_TOKEN secret (a PAT with push access to the separate
# fuzzphony/{core,postgres-engine,doctrine-bridge,symfony-bundle} repos) that was never
# configured, and those target repos don't exist yet either. Every run fails at the clone
# step with "could not read Password for 'https://github.com'". Re-enable the trigger below
# once both are set up -- no fixed timeline for that.
on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]
  #   tags: ['*']

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - { path: 'src/Core', repo: 'core' }
          - { path: 'src/Engine/Postgres', repo: 'postgres-engine' }
          - { path: 'src/Bridge/Doctrine', repo: 'doctrine-bridge' }
          - { path: 'src/Bundle', repo: 'symfony-bundle' }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: symplify/monorepo-split-github-action@v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_ACCESS_TOKEN }}
        with:
          package_directory: ${{ matrix.package.path }}
          repository_organization: 'fuzzphony'
          repository_name: ${{ matrix.package.repo }}
          tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          user_name: 'fuzzphony-bot'
          user_email: 'bot@fuzzphony.dev'
