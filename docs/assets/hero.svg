      <rect x="676" y="176" width="50" height="34" rx="6"/><rect x="734" y="176" width="50" height="34" rx="6"/>
      <rect x="792" y="176" width="50" height="34" rx="6"/>
    </g>
    <g fill="#1b2b3c">
      <text x="585" y="199">wir</text><text x="643" y="199">ire</text><text x="701" y="199">rel</text>
      <text x="759" y="199">ele</text><text x="817" y="199">ess</text>
    </g>
