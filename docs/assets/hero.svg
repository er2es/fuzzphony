<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="t d">
  <title id="t">Fuzzphony</title>
  <desc id="d">Fuzzphony: fuzzy search, in perfect harmony with your database. A misspelled query, wireles, is matched to Wireless through trigram blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4f82"/>
      <stop offset="1" stop-color="#336791"/>
    </linearGradient>
  </defs>
  <rect width="960" height="240" rx="18" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2">
    <path d="M0 200 C160 150 260 250 420 200 S700 150 960 205"/>
    <path d="M0 170 C160 120 260 220 420 170 S700 120 960 175"/>
  </g>
  <text x="48" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#ffffff">Fuzzphony</text>
  <text x="50" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#e3edf7">Fuzzy search, in perfect harmony</text>
  <text x="50" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#e3edf7">with your database.</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" text-anchor="middle">
    <text x="560" y="62" font-size="14" fill="#cfe0f0" text-anchor="start">query</text>
    <g fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".5">
      <rect x="560" y="72" width="50" height="34" rx="6"/><rect x="618" y="72" width="50" height="34" rx="6"/>
      <rect x="676" y="72" width="50" height="34" rx="6"/><rect x="734" y="72" width="50" height="34" rx="6"/>
      <rect x="792" y="72" width="50" height="34" rx="6"/>
    </g>
    <g fill="#ffffff">
      <text x="585" y="95">wir</text><text x="643" y="95">ire</text><text x="701" y="95">rel</text>
      <text x="759" y="95">ele</text><text x="817" y="95">les</text>
    </g>
    <path d="M585 110 V138 M643 110 V138 M701 110 V138 M759 110 V138 M817 110 V138" stroke="#f5a623" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="560" y="166" font-size="14" fill="#cfe0f0" text-anchor="start">index</text>
    <g fill="#f5a623" fill-opacity=".92">
