parameters:
    # Opt-in switches for the expensive diagnostics (off unless the environment sets them to 1):
    # EXPLAIN ANALYZE in the playground re-runs every query, /doctor?deep=1 counts every row exactly.
    env(DEMO_ALLOW_ANALYZE): '0'
    env(DEMO_ALLOW_DEEP_DOCTOR): '0'
    # Exact counts (a total and facets over every match, not only the candidates) read everything a query matches: opt-in too.
    env(DEMO_ALLOW_EXACT): '0'
    # Minimum level of the metric lines below; the worker container sets it to 'error' (an idle worker would log every second).
    env(DEMO_METRICS_LOG_LEVEL): 'debug'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude: '../src/Kernel.php'

    # The demo has no Monolog, and the default logger drops the debug-level lines LoggingMetricsCollector writes.
    # This one writes them to stderr, so `docker compose logs php` shows what Fuzzphony reports.
    app.metrics_logger:
        class: Symfony\Component\HttpKernel\Log\Logger
        arguments: ['%env(DEMO_METRICS_LOG_LEVEL)%', 'php://stderr', ['App\Service\MetricLogFormatter', 'format']]

    # The prepared synonym lists (src/Service/SynonymStore.php), keyed by index and version. The container's file
    # system is read-only apart from /tmp, so the pool lives there; it is rebuilt from the database after a restart.
    app.synonym_cache:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments: ['synonyms', 0, '/tmp/fuzzphony-demo-cache']

    fuzzphony.metrics:
        class: Fuzzphony\Core\Observability\LoggingMetricsCollector
        arguments: ['@app.metrics_logger']
