# The Security page (/under-the-hood/security) is the demo's only use of Symfony Security, and the worked example of
# docs/security.md. Four fixed viewers (no passwords, nothing from a form): the firewall covers that page only, so every
# other page of the demo runs as before. The viewer is chosen on the page and kept in the session.
security:
    providers:
        demo_viewers:
            id: App\Security\DemoUserProvider
    firewalls:
        main:
            pattern: ^/under-the-hood/security
            stateless: true # the authenticator reads the session on every request: there is no token to refresh
            provider: demo_viewers
            custom_authenticators:
                - App\Security\ViewerAuthenticator
