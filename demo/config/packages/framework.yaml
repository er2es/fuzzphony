framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    # Only the Security page uses the session (the "Viewing as" choice). The container's file system is read-only apart
    # from /tmp, so the files live there, like the synonym cache (config/services.yaml).
    session:
        save_path: '/tmp/fuzzphony-demo-sessions'
        cookie_samesite: lax
    # The Security page's rate limit (fuzzphony.rate_limit.limiter below): five searches in 10 seconds for each viewer (short, so the demo does not make you wait).
    rate_limiter:
        fuzzphony_search:
            policy: fixed_window
            limit: 5
            interval: '10 seconds'
            cache_pool: app.rate_limit_cache
    # No trusted_proxies on purpose: nginx talks FastCGI to php-fpm and sets REMOTE_ADDR to the client's address, so
    # Request::getClientIp() (what search_log.ip stores, masked) is right as it is. A trusted_proxies list that holds the private
    # ranges would be harmful here: Docker Desktop's gateway (the client's address) is private, so a forged X-Forwarded-For
    # header would be believed. Put another reverse proxy in front of nginx and the address is that proxy's: then
    # list that proxy only (framework.trusted_proxies, and trusted_headers), or log the real address in nginx (realip module).
    php_errors:
        log: true
    asset_mapper:
        paths:
            - assets/
        # No CDN dependency, and the CSP's script-src doesn't allow the default polyfill's
        # host (jspm.io) on purpose. Every browser this demo targets has native import maps
        # and dynamic import, so the polyfill is dead weight (and its own CSP self-test is
        # exactly the "data:" console warning you'd otherwise see on every page load).
        importmap_polyfill: false
