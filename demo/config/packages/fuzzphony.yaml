# The demo index: products joined with brands and categories (tables from ../benchmarks/seed.sql).
# Generated with `bin/console fuzzphony:wizard bench_product --name=catalog`, then tuned by hand.
fuzzphony:
  # Every Fuzzphony table, function and text search configuration lives in its own schema; the application's
  # tables (bench_product, lang_product, ...) stay in public. fuzzphony:schema --apply creates it.
  schema: fuzzphony
  # Every search is recorded after the response (the /under-the-hood/analytics page and `bin/console fuzzphony:analytics` read it).
  # E-mail addresses are replaced by [redacted] before anything is stored; rows older than 30 days are purged by
  # `bin/console fuzzphony:search-log:purge`.
  # `ip: masked` also stores where a search of an actor came from (192.0.2.45 is kept as 192.0.2.0) and the log already has the
  # user: that is personal data (docs/analytics.md, "Privacy"). Only the searches of the Security page carry an address and a user;
  # the catalog pages search with ->asSystem() (public data), whose rows are the user "(system)" without one. The address is
  # Request::getClientIp(): here nginx hands PHP the client's address over FastCGI (REMOTE_ADDR), so no framework.trusted_proxies is set
  # (see framework.yaml).
  search_log: { enabled: true, retention_days: 30, redact: [email], ip: masked }
  # The /under-the-hood/security page (docs/security.md): who searches decides what a search may see. A search that names no actor
  # is made as the current Security user (a visitor without a token is denied), so the guards below apply to EVERY search: the
  # Security page searches as that user; the catalog pages, which are public data and have no firewall, say ->asSystem().
  # The actor is read from the Security user: its company is the tenant, its identifier the user.
  actor: { tenant: company, user: userIdentifier }
  # isGranted('FUZZPHONY_SEARCH', 'intranet') before every actor search: App\Security\SearchVoter grants it to ROLE_USER.
  authorization: { enabled: true }
  # Five searches in 10 seconds for each user (framework.rate_limiter.fuzzphony_search in framework.yaml).
  rate_limit: { limiter: fuzzphony_search, per: user }
  indexes:
    catalog:
      source:
        query: |
          SELECT p.id, p.name, p.description, b.name AS brand, c.name AS category,
                 p.brand_id, p.category_id, p.price, p.in_stock, p.popularity, p.published_at
          FROM bench_product p
          JOIN bench_brand b ON b.id = p.brand_id
          JOIN bench_category c ON c.id = p.category_id
      fields:
        name: { weight: A, fuzzy: true }
        brand: { weight: B, fuzzy: true }
        category: C
        description: D
      filters:
        price: int
        in_stock: bool
        brand_id: int
        category_id: int
        published_at: datetime
      watch:
        bench_product: 'SELECT :id'
        bench_brand: 'SELECT id FROM bench_product WHERE brand_id = :id'
        bench_category: 'SELECT id FROM bench_product WHERE category_id = :id'
      language: english
      boost: popularity
      recency: published_at
      # the header's search box (/magic) shows the first lines of a hit from the hit itself, with no lookup
      returnable: [name, brand, category]
      profiles:
        popular: { boost: 0.03, recency: 0.3, recency_half_life_days: 60 }
      thresholds:
        relevance: { min_score: 0.01 }
      # No synonyms here: they live in the demo_synonym_entry table (sql/demo_synonym.sql). The /synonyms page edits them
      # and a request listener hands the prepared lists to Fuzzphony at run time (Fuzzphony::useSynonyms). They could just as well
      # come from a file: `synonyms: { file: '%kernel.project_dir%/config/synonyms/catalog.txt' }`.

    # The /under-the-hood/security page: intranet notes of two companies (sql/demo_note.sql). company_id is the tenant, so a
    # search sees one company's notes only; the confidential field is searched, ranked and highlighted for ROLE_HR only.
    intranet:
      source:
        # public.: the table is schema-qualified because the application role must resolve it from its own search_path too
        query: 'SELECT id, company_id, title, body, confidential FROM public.demo_note'
      fields:
        title: { weight: A, fuzzy: true }
        body: B
        confidential: { weight: C, fuzzy: true, granted: ROLE_HR }
      filters:
        company_id: int
      returnable: [title, body]
      tenant: company_id
      watch:
        public.demo_note: 'SELECT :id'
      language: english
      # typo tolerance only when nothing matches exactly (as on the Languages page): a few notes, clean examples
      thresholds: { typo: { fallback_below: 1 } }

    # The /languages page: one small hand-written catalogue (sql/lang_product.sql), one index per language.
    # Each index stems and removes stop words with its own language and folds accents (fuzzphony.fuzzphony_<language>).
    lang_en: &lang
      source:
        query: "SELECT id, name, description, category FROM lang_product WHERE lang = 'en'"
      fields:
        name: { weight: A, fuzzy: true }
        category: C
        description: D
      watch:
        lang_product: 'SELECT :id'
      returnable: [name, category]
      language: english
      # typo tolerance only when nothing matches exactly: on 31 products the default (fewer than 5 exact hits) would
      # mix typo matches into every stemming example
      thresholds: { typo: { fallback_below: 1 } }
    lang_de:
      <<: *lang
      source:
        query: "SELECT id, name, description, category FROM lang_product WHERE lang = 'de'"
      language: german
    lang_fr:
      <<: *lang
      source:
        query: "SELECT id, name, description, category FROM lang_product WHERE lang = 'fr'"
      language: french
    lang_es:
      <<: *lang
      source:
        query: "SELECT id, name, description, category FROM lang_product WHERE lang = 'es'"
      language: spanish
    lang_hu:
      <<: *lang
      source:
        query: "SELECT id, name, description, category FROM lang_product WHERE lang = 'hu'"
      language: hungarian

    # The ERP-like data set (sql/erp.sql: customers, contacts, addresses, orders; DEMO_ERP=0 leaves the tables empty). The index
    # `people` is a definition class (src/Search/PeopleAdminIndex.php: customers who are persons, with their cities and streets as
    # several values each). The next three show a company index with a many field and a code, an index with a join, and ONE index
    # over three sources. Every table a query reads is watched, by hand where the derived watch of a many field is not enough
    # (`fuzzphony:doctor` has no Watches warning); the sync is the catalogue's: queue, drained by the worker.
    companies:
      source:
        # phone: the main contact's number (a many field cannot be a code, so the code is one value of the company row)
        query: |
          SELECT cu.id, cu.name, cu.tax_no, cu.email, cu.created_at,
                 (SELECT ct.phone FROM erp_contact ct WHERE ct.customer_id = cu.id ORDER BY ct.id LIMIT 1) AS phone
          FROM erp_customer cu
          WHERE cu.kind = 'company'
      fields:
        name: { weight: A, fuzzy: true }
        tax_no: { weight: A, code: true }
        phone: { weight: B, code: true }
        email: C
        contact:
          weight: B
          fuzzy: true
          many: { from: erp_contact, key: customer_id, column: name, limit: 20 }
      filters:
        created_at: datetime
      watch:
        erp_customer: 'SELECT :id'
        erp_contact: { ids: 'SELECT :id', key: customer_id }
      returnable: [name, tax_no, email, phone]

    orders:
      source:
        query: |
          SELECT o.id, o.number, cu.name AS customer_name, o.status, o.total, o.ordered_at
          FROM erp_order o
          JOIN erp_customer cu ON cu.id = o.customer_id
      fields:
        number: { weight: A, code: true }
        customer_name: { weight: B, fuzzy: true }
      filters:
        status: string
        total: int
        ordered_at: datetime
      watch:
        erp_order: 'SELECT :id'
        erp_customer: 'SELECT id FROM erp_order WHERE customer_id = :id'
      recency: ordered_at
      returnable: [number, status, total, customer_name]

    # One list over persons, companies and orders: each source aliases its own columns to the shared fields title and text.
    # The hits say which source they come from (`kind`); erp_customer is read by two sources and erp_address by two indexes.
    site:
      sources:
        person:
          query: |
            SELECT cu.id, cu.name AS title,
                   cu.email || ' ' || coalesce(cu.birth_name, '') || ' ' ||
                   coalesce((SELECT string_agg(DISTINCT ad.city, ' ') FROM erp_address ad WHERE ad.customer_id = cu.id), '') AS text,
                   cu.email
            FROM erp_customer cu
            WHERE cu.kind = 'person'
          watch:
            erp_customer: 'SELECT :id'
            erp_address: { ids: 'SELECT :id', key: customer_id }
          returnable: [title, email]
        company:
          query: |
            SELECT cu.id, cu.name AS title,
                   cu.tax_no || ' ' ||
                   coalesce((SELECT string_agg(ct.name, ' ') FROM erp_contact ct WHERE ct.customer_id = cu.id), '') AS text,
                   cu.tax_no
            FROM erp_customer cu
            WHERE cu.kind = 'company'
          watch:
            erp_customer: 'SELECT :id'
            erp_contact: { ids: 'SELECT :id', key: customer_id }
          returnable: [title, tax_no]
        order:
          query: |
            SELECT o.id, o.number AS title, cu.name || ' ' || o.status AS text, o.status, o.total
            FROM erp_order o
            JOIN erp_customer cu ON cu.id = o.customer_id
          watch:
            erp_order: 'SELECT :id'
            erp_customer: 'SELECT id FROM erp_order WHERE customer_id = :id'
          returnable: [title, status, total]
      fields:
        title: { weight: A, fuzzy: true }
        text: C
