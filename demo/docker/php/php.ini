; Production settings shared by every PHP process in the image (php-fpm, the worker, the init job).
; Loaded from conf.d/, so no `php -d ...` flags are needed anywhere.
expose_php = 0
memory_limit = 256M
date.timezone = UTC
zend.assertions = -1

; Errors go to stderr (docker logs), never to the response.
display_errors = 0
log_errors = 1
error_log = /proc/self/fd/2

; The image is immutable: nothing changes on disk after the build, so PHP never has to stat a file again.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1

; Symfony resolves thousands of paths per request; cache the lookups.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
