; The whole FPM configuration (the image's default www.conf / zz-docker.conf are removed).
; ${VARS} are read from the environment; the Dockerfile and docker-compose.yml set defaults for all of them.
[global]
error_log = /proc/self/fd/2
daemonize = no
log_level = notice
; a SIGTERM/SIGQUIT lets in-flight requests finish, for at most this long
process_control_timeout = 20s
emergency_restart_threshold = 10
emergency_restart_interval = 1m

[www]
listen = 9000
listen.backlog = 511
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Sizing. The request work is mostly waiting for PostgreSQL, so more children than CPU cores pay off; each child
; is ~25-40 MB with the preloaded container, so 16 fit in the container's 768 MB with headroom.
; Children are recycled after max_requests to bound any leak.
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}
pm.status_path = /status
ping.path = /ping
ping.response = pong

; A request that runs longer than this is killed (nginx gives up at the same point); slower than PHP_FPM_SLOWLOG_TIMEOUT is logged
; with a PHP backtrace to stderr.
request_terminate_timeout = 60s
request_slowlog_timeout = ${PHP_FPM_SLOWLOG_TIMEOUT}
slowlog = /proc/self/fd/2

php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 60
