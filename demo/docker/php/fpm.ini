; php-fpm only (PHP_INI_SCAN_DIR=":/usr/local/etc/php/fpm.d", set on the php service): preload the compiled
; Symfony container and the framework classes once, in the master, instead of once per worker.
; Keep the CLI processes (worker, init) out of it: they would re-run the preload on every start.
opcache.preload = /app/demo/var/cache/prod/App_KernelProdContainer.preload.php
