add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# The importmap and a few style attributes are inline; everything else is same-origin.
# "data:" in script-src is for AssetMapper's importmap only: it maps every imported stylesheet
# to a compiler-generated "data:application/javascript,..." no-op/loader entry (see
# vendor/symfony/asset-mapper/ImportMap/ImportMapRenderer.php) so the module graph resolves
# without a real network request. That content is baked in at build time from our own asset
# list, never from a request, so this doesn't reopen the usual data:-URI XSS vector (an
# attacker would need to control what gets compiled into the importmap, not just a request).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
