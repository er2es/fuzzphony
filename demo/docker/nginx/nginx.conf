# nginx in front of php-fpm: static files and fingerprinted assets straight from disk, everything else to FPM.
# Runs as the unprivileged nginx user on 8080 with a read-only root filesystem (temp files live in /tmp).
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr "$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # timeouts: slow clients cannot hold a worker connection hostage
    keepalive_timeout 30s;
    keepalive_requests 1000;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    reset_timedout_connection on;
    client_max_body_size 1m;

    # HTML is always compressed; the assets are also pre-compressed at build time (.gz next to the file).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_static on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Docker's embedded DNS: the php container may be recreated with a new address, so it is resolved per request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080 default_server;
        server_name _;
        root /app/demo/public;

        include /etc/nginx/security-headers.conf;

        # Liveness of the whole web tier: nginx -> php-fpm (its ping handler, no PHP code, no database).
        location = /healthz {
            access_log off;
            set $php php:9000;
            include /etc/nginx/fastcgi-php.conf;
            fastcgi_param SCRIPT_NAME /ping;
            fastcgi_param SCRIPT_FILENAME /ping;
            fastcgi_pass $php;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
        }

        # AssetMapper output: the file name carries a content digest, so it can be cached forever.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
            # dev mode serves assets from PHP instead
            try_files $uri @app;
        }

        # The compiled manifests are for PHP only.
        location ~ ^/assets/[^/]+\.json$ {
            return 404;
        }

        location / {
            try_files $uri @app;
        }

        location @app {
            set $php php:9000;
            include /etc/nginx/fastcgi-php.conf;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param SCRIPT_FILENAME /app/demo/public/index.php;
            fastcgi_pass $php;
        }

        # PHP files are never served or executed directly
        location ~ \.php$ {
            return 404;
        }
    }
}
