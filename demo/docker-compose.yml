# One command demo:  docker compose up --build   ->  http://localhost:8000
#   DEMO_ROWS=1000000 docker compose up --build    (default 200 000; 1M takes a few minutes to seed + index)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fuzzphony
      POSTGRES_USER: fuzzphony
      POSTGRES_PASSWORD: fuzzphony
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuzzphony"]
      interval: 2s
      retries: 30

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: "postgresql://fuzzphony:fuzzphony@db:5432/fuzzphony?serverVersion=17&charset=utf8"
      PGPASSWORD: fuzzphony
      DEMO_ROWS: ${DEMO_ROWS:-200000}
    volumes:
      - ..:/app
    ports: ["8000:8000"]
    command: >
      sh -c "composer install --no-interaction --prefer-dist &&
      (psql -h db -U fuzzphony fuzzphony -tAc \"SELECT to_regclass('bench_product')\" | grep -q bench_product
      || psql -h db -U fuzzphony fuzzphony -v rows=$$DEMO_ROWS -f ../benchmarks/seed.sql) &&
      php bin/console importmap:install &&
      composer setup &&
      (php bin/console fuzzphony:worker --time-limit=86400 &) &&
      php -S 0.0.0.0:8000 -t public"
